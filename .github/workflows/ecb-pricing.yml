name: "ECB Pricing: update data"
on:
  schedule:
    - cron: "15 21 * * 1-5"   # weekdays 21:15 UTC, after Eurex publishes settlements (GitHub often runs it a little late)
  workflow_dispatch:           # lets you run it by hand from the Actions tab
permissions:
  contents: write
  pages: write
jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ecb-pricing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python build.py
      - env:
          GH_TOKEN: ${{ github.token }}
        run: bash ../.github/save.sh "Update ECB pricing data" data.json history.csv
