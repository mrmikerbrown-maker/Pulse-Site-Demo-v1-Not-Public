name: "Fed Scenario Planner: update data"
on:
  schedule:
    - cron: "30 22 * * 1-5"   # weekdays 22:30 UTC, after the US close (GitHub often runs it a few hours late)
  workflow_dispatch:           # lets you run it by hand from the Actions tab
permissions:
  contents: write
  pages: write
jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fed-scenario-planner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy requests
      - run: python build_data.py
      - env:
          GH_TOKEN: ${{ github.token }}
        run: bash ../.github/save.sh "Update Fed planner data" data.json
