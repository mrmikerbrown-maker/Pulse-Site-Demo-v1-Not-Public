name: "CFTC probe (temporary)"
on:
  push:
    branches: [claude/project-thread-fhcz6j]
    paths: [".github/workflows/cftc-probe.yml", "cftc-probe/probe.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python cftc-probe/probe.py
      - env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/save.sh "CFTC probe results" cftc-probe
