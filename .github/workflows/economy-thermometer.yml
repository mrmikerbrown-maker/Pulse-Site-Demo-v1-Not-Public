name: "Economy Thermometer: update data"
on:
  schedule:
    - cron: "17 6 * * *"   # every day at about 07:17 UK time
  workflow_dispatch:        # lets you run it by hand from the Actions tab
permissions:
  contents: write
  pages: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch the data and work out the readings
        run: python economy-thermometer/scripts/update.py
      - name: Save the new data file
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/save.sh "Update economy data" economy-thermometer/data.json
