name: "Release playback: one-off data probe (sketch)"
on:
  push:
    branches: [claude/project-thread-bg9k1m]
    paths: [release-playback/probe/probe.py]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests websocket-client
      - run: python3 release-playback/probe/probe.py || true
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add release-playback/probe/out && git commit -qm "Probe results" && git push || true
