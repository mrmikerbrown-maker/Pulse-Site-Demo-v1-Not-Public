name: Update central bank data

on:
  schedule:
    - cron: "30 6 * * *"    # every morning, about 06:30-07:30 UK time
    - cron: "30 20 * * *"   # and every evening, to catch same-day Fed/ECB/BoE moves
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Get the files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the rates and work out the decisions
        run: python scripts/update.py

      - name: Save the new data file
        if: always()
        run: |
          git config user.name "central-bank-bot"
          git config user.email "central-bank-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Update data"
          git push

      - name: Ask GitHub Pages to refresh the page
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
