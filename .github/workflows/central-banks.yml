name: "Central banks: update rates"
on:
  schedule:
    - cron: "30 6 * * *"    # every morning, about 06:30-07:30 UK time
    - cron: "30 20 * * *"   # and every evening, to catch same-day Fed/ECB/BoE moves
  workflow_dispatch:         # lets you run it by hand from the Actions tab
permissions:
  contents: write
  pages: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch the rates and work out the decisions
        run: python central-banks/scripts/update.py
      - name: Save the new data file
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/save.sh "Update central bank data" central-banks/data.json
