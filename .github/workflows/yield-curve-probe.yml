name: "Yield curve: source probe (temporary)"
on:
  push:
    branches: [claude/project-thread-49o3v9]
    paths: [yield-curve/probe/probe.py, .github/workflows/yield-curve-probe.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests openpyxl
      - run: python yield-curve/probe/probe.py
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898208+github-actions[bot]@users.noreply.github.com"
          git add yield-curve/probe/out && git commit -q -m "Probe results" && git push -q || true
