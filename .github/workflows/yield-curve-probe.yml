name: "Yield curve: source probe (temporary)"
on:
  push:
    branches: [claude/project-thread-49o3v9]
    paths: [yield-curve/probe/probe_tv.py, .github/workflows/yield-curve-probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: python yield-curve/probe/probe_tv.py
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898208+github-actions[bot]@users.noreply.github.com"
          git add yield-curve/probe/out && git commit -q -m "TV probe results" && git push -q || true
