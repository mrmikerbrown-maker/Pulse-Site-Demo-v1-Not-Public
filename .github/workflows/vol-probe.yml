name: vol-probe (temporary)
on:
  push:
    branches: [claude/project-thread-klenjt]
    paths: [vol-probe/probe.py, .github/workflows/vol-probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests websocket-client
      - run: python vol-probe/probe.py
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vol-probe/data.json && git commit -m "probe data" && git push
