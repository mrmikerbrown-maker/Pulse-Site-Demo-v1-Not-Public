name: "Earnings Moves: update data"
on:
  schedule:
    - cron: "40 21 * * 1-5"   # weekdays 21:40 UTC (21:40 London in winter, 22:40 in summer): after the US close, so the
                              # options prices are the closing ones, taken before any after-the-close or next-morning report
  workflow_dispatch:           # lets you run it by hand from the Actions tab
permissions:
  contents: write
  pages: write
concurrency: earnings-moves
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: earnings-moves
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python build.py
      - env:
          GH_TOKEN: ${{ github.token }}
        run: bash ../.github/save.sh "Update earnings moves data" data.json implied-log.csv calendar-archive.json
