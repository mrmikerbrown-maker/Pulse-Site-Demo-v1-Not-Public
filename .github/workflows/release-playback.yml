name: "Release Playback: update data"
# Weekdays after the US close: adds new releases, first-announced figures (FRED), daily prices and
# the release-day 5-minute replay for each release (saved once and kept, the free feed only holds about a month).
on:
  schedule:
    - cron: "40 22 * * 1-5"   # weekdays 22:40 UTC (GitHub often starts these late, which is fine)
    - cron: "40 9 * * 2-6"    # backup run the next morning, in case the evening one is skipped
  workflow_dispatch:           # lets you run it by hand from the Actions tab
  push:
    branches: [claude/project-thread-bg9k1m]   # test runs on the build branch only (removed before merge)
    paths: [release-playback/build.py, .github/workflows/release-playback.yml]
permissions:
  contents: write
  pages: write
concurrency:
  group: release-playback
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: release-playback
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests websocket-client
      - env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python build.py
      - env:
          GH_TOKEN: ${{ github.token }}
        run: bash ../.github/save.sh "Update release playback" data.json releases.json replays.json first-print.csv
