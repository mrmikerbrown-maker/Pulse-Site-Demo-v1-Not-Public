name: "Calendar: update this week"
on:
  schedule:
    # Every 15 minutes on weekdays, 05:00-21:45 UTC (06:00-22:45 London in winter).
    # GitHub sometimes runs scheduled jobs late.
    - cron: "*/15 5-21 * * 1-5"
    # Overnight Asia releases (NZ, Australia, Japan, China)
    - cron: "*/30 22-23 * * 0-4"
    - cron: "*/30 0-4 * * 1-5"
    # Saturday and Sunday: load next week
    - cron: "0 9 * * 6"
    - cron: "0 18 * * 0"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: calendar
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 calendar/scripts/fetch.py
      - env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/save.sh "Update calendar" calendar/data/
