name: "Calendar: update this week"
# GitHub only fires scheduled jobs a few times a day in practice (often hours late or skipped),
# so each run keeps going for up to 5h50m and checks the calendar every 5 minutes itself.
# A new run starts every hour and takes over from the previous one, so a skipped start doesn't matter.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: calendar
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          end=$(( $(date +%s) + 350*60 ))
          while :; do
            git pull -q --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            python3 calendar/scripts/fetch.py || echo "fetch failed, will try again"
            bash .github/save.sh "Update calendar" calendar/data/ || true
            # Weekdays every 5 minutes; weekends (when only next week's schedule changes) every 30.
            if [ "$(date -u +%u)" -ge 6 ]; then wait=1800; else wait=300; fi
            [ $(( $(date +%s) + wait )) -lt "$end" ] || break
            sleep "$wait"
          done
