name: Save SPY weights
on:
  schedule:
    # State Street's file lags by a day or so, so check several times each weekday (UTC) and keep whatever is newest
    - cron: "0 11,13,22 * * 1-5"
    - cron: "20 14 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  spy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/spy.py
      - run: |
          git add spy-weights*.csv
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898208+github-actions[bot]@users.noreply.github.com" commit -m "Save SPY weights"
          git push
