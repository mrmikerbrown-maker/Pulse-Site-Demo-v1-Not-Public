name: "Yield Curves: update data"
on:
  schedule:
    - cron: "45 16 * * 1-5"   # weekdays 16:45 UTC: after the London close
    - cron: "15 22 * * 1-5"   # weekdays 22:15 UTC: after the US close
  workflow_dispatch:           # lets you run it by hand from the Actions tab
permissions:
  contents: write
  pages: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: yield-curve
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests openpyxl
      - run: python build.py
      - env:
          GH_TOKEN: ${{ github.token }}
        run: bash ../.github/save.sh "Update yield curves" data.json tv-history.csv
