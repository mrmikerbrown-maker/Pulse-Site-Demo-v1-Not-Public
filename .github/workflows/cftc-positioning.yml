name: "Speculator Positioning: update CFTC data"
on:
  schedule:
    - cron: "15 21 * * 5"   # Fridays 21:15 UTC: the CFTC publishes at 15:30 New York (20:30 London in winter, 19:30 UTC in summer)
    - cron: "0 9 * * 6"     # Saturday morning, in case Friday's run failed
    - cron: "15 21 * * 1,2" # Monday and Tuesday evenings: after US holidays the CFTC publishes a few days late
  workflow_dispatch:         # lets you run it by hand from the Actions tab
permissions:
  contents: write
  pages: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cftc-positioning
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python build.py
      - env:
          GH_TOKEN: ${{ github.token }}
        run: bash ../.github/save.sh "Update speculator positioning data" data.json
