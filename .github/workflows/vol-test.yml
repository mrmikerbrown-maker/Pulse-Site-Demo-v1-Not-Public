name: vol-test (temporary)
on:
  push:
    branches: [claude/project-thread-klenjt]
    paths: [vol-monitor/build.py, .github/workflows/vol-test.yml]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests websocket-client
      - run: python3 vol-monitor/build.py
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vol-monitor/data.json && git commit -m "Volatility Monitor: first data" && git push
