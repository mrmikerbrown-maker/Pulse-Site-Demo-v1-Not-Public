name: Save SPY weights
on:
  schedule:
    # Once each weekday at 13:15 UTC, before the US open in summer and winter
    - cron: "15 13 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  spy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/spy.py
      - run: |
          git add spy-weights*.csv
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898208+github-actions[bot]@users.noreply.github.com" commit -m "Save SPY weights"
          git push
