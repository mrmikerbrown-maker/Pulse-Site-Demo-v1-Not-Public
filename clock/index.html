  var v=[],pp=[],bb=[];for(h=0;h<24;h++){var ok=n[h]>=okn;v.push(ok?s[h]/n[h]:null);if(p)pp.push(ok?p[h]/n[h]:null);if(r.bp)bb.push(ok?s[h]/n[h]/6.5*100:null)}
  return{k:r.k,n:r.n,v:v,c:n,p:p?pp:null,b:r.bp?bb:null}});
 return{rows:rows,mn:mm}}
function lab(h){return pad(h)+":"+pad(MN)}
function lab2(h){return lab(h)+" to "+lab((h+1)%24)}
function fmt(r,v,h){return r.b?"about "+r.b[h].toFixed(1)+" bp ("+v.toFixed(2)+"% in price)":v.toFixed(2)+"%"}
function ord(n){return n===1?"Busiest hour":n===2?"2nd busiest":n===3?"3rd busiest":n+"th busiest"}
function grid(){
 var h="";
 R.forEach(function(r,i){h+='<div class="row'+(r.k==="eurusd"&&i>0?' g1':'')+'"><div class="rl">'+r.n+'</div><div class="cells">';
  r.v.forEach(function(v,hh){
   if(v==null){var cl=r.c[hh]<CLN;h+='<button class="c '+(cl?'cl':'na')+'" data-h="'+hh+'" aria-label="'+r.n+', '+lab2(hh)+': '+(cl?'market closed':'too few prices')+'"></button>'}
   else{var x=v/rank[i].mx,a=.07+.93*Math.pow(x,1.3);h+='<button class="c" data-h="'+hh+'" style="background:rgba(var(--hm),'+a.toFixed(3)+')" aria-label="'+r.n+', '+lab2(hh)+': average move '+fmt(r,v,hh)+'"></button>'}});
  h+='</div></div>'});
 $("rows").innerHTML=h;
 var ax="";for(var k=0;k<24;k++)ax+='<button class="hb" data-h="'+k+'" aria-label="Hour '+lab(k)+'">'+(k%3===0?pad(k):"")+'</button>';
 $("axis").innerHTML=ax}
function xm(i,v){if(!E||!BASE)return"";var b=BASE[R[i].k];b=b&&b.v[sel];if(!b)return"";var r=v/b;return'<div class="x">'+(r>=0.95&&r<1.05?"about a normal day":(r>=1?r.toFixed(1)+"× a normal day":Math.round(r*100)+"% of a normal day"))+"</div>"}
var BASE=null;
function show(){
 $("plot").style.setProperty("--h",sel);
 document.querySelectorAll(".hb").forEach(function(b){b.className="hb"+(+b.getAttribute("data-h")===sel?" on":"")});
 $("rt").textContent=lab2(sel);
 var o="";R.forEach(function(r,i){var v=r.v[sel];
  if(v==null)o+='<div><div class="t">'+r.n+'</div><div class="v">–</div><div class="k">'+(r.c[sel]<CLN?'Market closed':'Too few prices to measure')+'</div></div>';
  else{var rk=rank[i].m[sel];o+='<div><div class="t">'+r.n+'</div><div class="v">'+(r.b?'≈ '+r.b[sel].toFixed(1)+' bp<span class="s">'+v.toFixed(2)+'% in price</span>':fmt(r,v,sel))+'</div><div class="k'+(rk<=3?" top":"")+'">'+ord(rk)+' of '+rank[i].n+'</div>'+xm(i,v)+'</div>'}});
 $("st").style.gridTemplateColumns=R.length===1?"1fr":"";
 $("st").innerHTML=o}
function chips(){
 var dc=dayCounts(TZ),h='<button class="chip'+(WD<0&&!E?' on':'')+'" data-d="-1">All days</button>';
 [1,2,3,4,5,6,0].forEach(function(d){if(dc[d]>=200)h+='<button class="chip'+(WD===d?' on':'')+'" data-d="'+d+'">'+DN[d].slice(0,3)+'</button>'});
 if(WD>=0||E)h+='<button class="chip clr" data-d="-1">✕ Clear filter</button>';
 $("wd").innerHTML=h;
 var es=$("ev");if(!es.options.length){var o='<option value="">All days</option>';EG.forEach(function(g){o+='<optgroup label="'+g[0].replace("Decision days","Central bank decisions")+'">';g[1].forEach(function(k){o+='<option value="'+k+'">'+EN[k]+(DK.indexOf(k)>=0?"":" decision")+' ('+EV[k].length+' days)</option>'});o+='</optgroup>'});es.innerHTML=o}
 es.value=E||""}
function decMark(){
 var el=$("dec"),pl=$("plot");
 if(!E){el.hidden=true;pl.classList.remove("hd");DEC=null;return}
 var c=tzc(TZ),hs=[],cnt={},best=0,bi=0;
 EV[E].forEach(function(ms){var p=c.f.formatToParts(new Date(ms)),h=0,m=0;for(var i=0;i<p.length;i++){if(p[i].type==="hour")h=+p[i].value;else if(p[i].type==="minute")m=+p[i].value}
  var ix=Math.floor(((((h*60+m-MN)%1440)+1440)%1440)/60);cnt[ix]=(cnt[ix]||0)+1});
 for(var k in cnt)if(cnt[k]>best){best=cnt[k];bi=+k}
 DEC=bi;el.hidden=false;el.style.setProperty("--e",bi);el.className="dec"+(bi>=20?" r":bi<=2?" l":"");
 el.setAttribute("data-t",(E==="BoJ"?"≈":"")+evInfo(TZ,E).time+" "+EL[E]);pl.classList.add("hd")}
function refresh(reset){
 var ok=(WD<0&&!E)?40:E?(evInfo(TZ,E).n>=9?5:3):20;OKN=ok;CLN=ok>=40?40:E?ok-1:10;
 var a=agg(TZ,WD,E,ok);R=a.rows;MN=a.mn;
 var c=tzc(TZ);if(E&&!c.base){c.base={};agg(TZ,-1,null,40).rows.forEach(function(r){c.base[r.k]=r})}BASE=E?c.base:null;
 rank=R.map(function(r){var o=[];r.v.forEach(function(v,h){if(v!=null)o.push([v,h])});o.sort(function(x,y){return y[0]-x[0]});var m={};o.forEach(function(p,i){m[p[1]]=i+1});return{m:m,n:o.length,mx:o[0]?o[0][0]:1}});
 decMark();
 if(reset){var best=-1,bi=13;for(var h=0;h<24;h++){var s=0,cc=0;R.forEach(function(r,i){if(r.v[h]!=null){s+=r.v[h]/rank[i].mx;cc++}});if(cc===R.length&&s>best){best=s;bi=h}}sel=bi}
 if(E&&DEC!=null)sel=DEC;
 $("rn").textContent=TZ.replace(/_/g," ")+" ("+offs(TZ)+")"+(WD>=0?" · "+DN[WD]+"s only":E?" · "+EN[E]+(DK.indexOf(E)>=0?"":" decision")+" days ("+evInfo(TZ,E).n+")":"");
 grid();show();now()}
function nowIdx(){var p=tzc(TZ).f.formatToParts(new Date()),h=0,m=0;for(var i=0;i<p.length;i++){if(p[i].type==="hour")h=+p[i].value;else if(p[i].type==="minute")m=+p[i].value}return Math.floor(((((h*60+m-MN)%1440)+1440)%1440)/60)}
function wkend(){var d=new Date(),w=d.getUTCDay(),h=d.getUTCHours();return w===6||(w===0&&h<22)||(w===5&&h>=22)}
function now(){
 var el=$("now"),nw=$("nw");
 if(E){el.hidden=true;nw.textContent="";return}
 if(wkend()){el.hidden=true;nw.textContent="Markets are closed for the weekend.";return}
 nw.textContent="";el.hidden=false;el.style.setProperty("--n",nowIdx())}

setInterval(function(){if(!document.hidden)now()},60000);
function dl(s){return new Date(s+"T00:00:00Z").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric",timeZone:"UTC"})}
$("note").innerHTML="<p>Each square is the average size of the move in that hour, up or down, from hourly prices between "+dl(D.from)+" and "+dl(D.to)+". <span class=\"dk\">Brighter</span><span class=\"lt\">Darker</span> means busier. Each row is scaled to its own busiest hour, so compare hours within a row, not one row with another. Past patterns are not a forecast.</p><details><summary>How to read this</summary><ul><li><b>Time zones:</b> hours are shown in the zone you pick, with daylight saving applied. The US and UK change clocks on different dates, so a few US events land an hour earlier in UK time.</li><li><b>Event days:</b> a day runs midnight to midnight in the market that publishes the release (New York, London, Frankfurt or Tokyo). Each hour rests on far fewer days, so treat these views as indicative, and GDP (four releases each) with extra caution. A few dates are shared: on 18 Dec 2025 the ECB, the Bank of England and US CPI all landed together. The 2025 US shutdown cancelled the October CPI and jobs reports.</li><li><b>Red marker:</b> the scheduled time. US CPI, jobs, retail sales and GDP 08:30 New York; ISM PMIs 10:00 New York; UK CPI, jobs and retail sales 07:00 London; UK flash PMIs 09:30 London; Eurozone flash PMIs 10:00 and other releases 11:00 Frankfurt; Japanese CPI and unemployment 08:30 Tokyo, GDP 08:50 Tokyo; FOMC 14:00 New York; ECB 14:15 Frankfurt; Bank of England 12:00 London. The Bank of Japan has no set time, so its marker is approximate (around midday Tokyo).</li><li><b>Pairs only:</b> UK, Eurozone and Japanese data days show just the matching currency pair, because those releases rarely move US equities, Treasuries or gold.</li><li><b>Prices:</b> S&amp;P 500, 10-year Treasuries and gold use futures; the currency pairs use spot. The basis-point figure for Treasuries is an estimate of the equivalent yield move. Futures pause for an hour each day (22:00 to 23:00 London), and gold's first hour after the break includes the move across it. In some zones the pause shifts by an hour for part of the year, so two hours can show fewer days.</li></ul></details>";
