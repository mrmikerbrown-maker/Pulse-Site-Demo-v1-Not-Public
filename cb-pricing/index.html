<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Central Bank Pricing</title>
<script>try{var t=localStorage.getItem("ict-theme");if(t?t==="light":matchMedia("(prefers-color-scheme: light)").matches)document.documentElement.classList.add("light")}catch(e){}</script>
<style>
:root{--bg:#06060A;--card:#0D0E15;--line:#22242E;--text:#FFFFFF;--text2:#CBD5E1;--muted:#8A8FA3;--dim:#5E6273;--accent:#00E0FF;--pink:#FF3B6B;--up:#3DDC97;--down:#FF5C7A;--upa:61,220,151;--downa:255,92,122;--hl:rgba(0,224,255,.10);color-scheme:dark}
:root.light{--bg:#F5F6F8;--card:#FFFFFF;--line:#E1E4EA;--text:#0B0D14;--text2:#3A4150;--muted:#6B7280;--dim:#9AA0AC;--accent:#00B4D8;--pink:#E62E5C;--up:#0E9F6E;--down:#E23D52;--upa:14,159,110;--downa:226,61,82;--hl:rgba(0,180,216,.10);color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text2);font-family:ui-sans-serif,system-ui,-apple-system,"SF Pro Display","Inter","Segoe UI",Roboto,sans-serif;line-height:1.4;padding-bottom:env(safe-area-inset-bottom,0px)}
body:before{content:"";position:fixed;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,#00e0ff,rgba(0,224,255,0) 40%,rgba(0,224,255,0) 60%,#ff3b6b);z-index:20}
a{color:inherit;text-decoration:none}
/* Newsquawk top bar (shared with the other tools; nav.js adds the "All tools" menu before #theme) */
.top{display:flex;align-items:center;gap:8px;margin:0 0 22px}
.logo{display:block;width:150px;height:auto;margin:0 auto 0 0}
:root.light .logo{filter:invert(1) hue-rotate(180deg)}
.theme{appearance:none;display:inline-flex;align-items:center;justify-content:center;flex:none;width:30px;height:30px;padding:0;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text2);cursor:pointer}
.theme svg{width:15px;height:15px}
.i-moon{display:none}:root.light .i-sun{display:none}:root.light .i-moon{display:block}
@media (max-width:760px){.logo{width:120px}}
/* page */
.wrap{max-width:1100px;margin:0 auto;padding:8px 16px 40px}
h1{font-size:clamp(24px,4.4vw,34px);line-height:1.15;margin:0 0 8px;color:var(--text);letter-spacing:-.01em;text-wrap:balance}
h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 12px;font-weight:700}
.sub{color:var(--muted);font-size:15px;margin:0 0 14px;max-width:62ch}
.stamp{font-size:12px;color:var(--dim);margin:0 0 16px;letter-spacing:.04em;text-transform:uppercase}
.stamp.old{color:var(--pink)}
.srcbox{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 18px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:12px 16px;margin:14px 0;font-size:13px;color:var(--text)}
.srcbox span{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.srcbox .old{color:var(--pink)}
.n{color:var(--muted);font-size:12px;margin-top:8px}
.warn{border:1px solid var(--line);border-left:3px solid var(--pink);border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:14px;background:var(--card)}
.warn b{color:var(--text)}
.dwarn{border:1px solid var(--line);border-left:3px solid var(--pink);border-radius:10px;padding:10px 14px;font-size:13px;margin:0 0 14px;background:var(--card);color:var(--text2)}.dwarn b{color:var(--text)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
label{display:block;font-size:13px;color:var(--text2);font-weight:600}label small{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:2px}
input[type=number],select,textarea{width:100%;margin-top:6px;font:inherit;font-size:14px;padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
input[type=range]{width:100%;accent-color:var(--accent)}
.pv{font-size:24px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums;margin-top:4px}
button{font:inherit;font-size:13px;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text2);cursor:pointer}
button.on{background:var(--accent);border-color:var(--accent);color:#06060A;font-weight:700}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;font-size:13px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.info span{color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase}.info b{color:var(--text)}
summary{cursor:pointer;font-size:14px;font-weight:700;color:var(--text)}details .g{margin-top:14px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -18px;padding:0 18px}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:780px;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;white-space:nowrap;position:sticky;left:0;background:var(--card);z-index:1}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
td{color:var(--text)}
td small{display:block;font-size:10px;color:var(--muted);font-weight:400}
tr.s td{color:var(--muted);font-size:12px}tr.e td{font-weight:800;border-top:2px solid var(--line)}
.res{margin-top:12px;font-size:13px}.res b{font-size:15px;color:var(--text)}.res div{margin-top:4px}
tr.u td{background:var(--hl);font-weight:700}tr.u td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.w{width:60px!important;display:inline-block;margin:0!important;padding:3px 5px!important;font-size:12px!important}
.foot{margin-top:26px;font-size:12px;color:var(--dim);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
.foot a{color:var(--accent)}
@media (max-width:760px){.card{padding:16px}.tw{margin:0 -16px;padding:0 16px}table{font-size:12px}th,td{padding:8px 7px}td:first-child{white-space:normal;min-width:84px;max-width:96px}.w{width:46px!important}}
/* rate path ("hike ladder"): one row of 25bp blocks per meeting */
:root{--slot:#161824;--cmp:#FFFFFF}:root.light{--slot:#EEF0F4;--cmp:#0B0D14}
.rp-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:0 0 16px;padding:0 0 14px;border-bottom:1px solid var(--line)}
.rp-stats span{display:block;color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.rp-stats b{color:var(--text);font-size:20px;font-variant-numeric:tabular-nums}
.rp-ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:10px}
.rp-show{margin-left:14px}
.rp-seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.rp-seg button{border:0;border-radius:0;font-size:12px;padding:6px 11px;color:var(--muted)}
.rp-seg button+button{border-left:1px solid var(--line)}
.rp-seg button.on{color:#06060A}
.rp-seg.bank{margin:0 0 16px}.rp-seg.bank button{font-size:14px;font-weight:600;padding:8px 18px}
.rp-row{display:grid;grid-template-columns:120px minmax(0,1fr) 76px 64px 112px 84px;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.rp-row.hd{white-space:nowrap;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding-top:0}
.rp-row.hd>div:nth-child(n+3){text-align:right}
.rp-row>.v{text-align:right;color:var(--text);font-size:14px}.rp-row>.v.big{font-weight:800;font-size:15px}
.rp-dt b{display:block;color:var(--text);font-size:14px}.rp-dt small{color:var(--muted);font-size:11px}
.rp-up{color:var(--down)!important}.rp-dn{color:var(--up)!important}.rp-mu{color:var(--muted)!important}
.rp-blocks{position:relative;display:flex;gap:4px;height:22px}
.rp-blk{flex:1;background:var(--slot);border-radius:4px;position:relative;overflow:hidden}
.rp-blk i{position:absolute;top:0;bottom:0;left:0;background:var(--down);border-radius:4px}
.rp-blk.c i{left:auto;right:0;background:var(--up)}
.rp-blk.z{flex:0 0 2px;background:var(--muted);border-radius:1px}
.rp-mk{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--cmp);border-radius:1px;box-shadow:0 0 0 2px var(--card)}
.rp-scale{display:flex;gap:4px;font-size:10px;color:var(--dim);margin-top:4px}.rp-scale span{flex:1;text-align:right}.rp-scale .z{flex:0 0 2px}
.rp-key{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:12px}
.rp-key i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:6px}
@media (max-width:760px){.rp-row{grid-template-columns:1fr auto auto;row-gap:8px;column-gap:12px}.rp-row .rp-blocks,.rp-row .rp-scale{grid-column:1/-1;order:9}.rp-row .c-chg,.rp-row .c-cmp,.rp-row.hd,.rp-show,#rpview{display:none}}
</style>
<script src="../nav.js" defer></script>
</head>

<h1>Central Bank Pricing</h1>
<p class="sub">Tightening or easing priced by markets for each central bank meeting, as far out as contracts trade. Pick a central bank.</p>

 </div>

<script>
var D=null,$=function(i){return document.getElementById(i)},BANK="fed",CACHE={};
/* One entry per central bank; the switch above the chart is built from this list, in this order.
   To add a bank: give it a data job that writes a data.json with the same "path" shape as ecb-pricing/data.json
   (meetings, rates, effr = today's rate, asof, compare), then add an entry here. time = decision time in UTC.
   policy = [key in data.json holding {value}, label] for the official policy rate shown first, if the data has it.
   stamp = what the date in the grey line refers to. */
var BANKS={
 fed:{label:"Fed",url:"../fed-scenario-planner/data.json",fut:"fed funds futures",futs:"fed funds futures",time:"T19:00:00Z",
  base:"Effective fed funds rate",srcShort:"CBOT 30-day fed funds futures (via Yahoo, delayed)",freq:"Weekdays, after the US close (around 22:30 London)",
  note:'Rates are the average effective fed funds rate each futures contract prices after that meeting. Want to see how markets could react to the next decision? <a href="../fed-scenario-planner/" style="color:var(--accent)">Open the Fed Scenario Planner →</a>',
  src:"Data: CBOT 30-day fed funds futures via Yahoo (delayed), effective fed funds rate from the New York Fed, meeting dates from the Federal Reserve. Updated each weekday night."},
 ecb:{label:"ECB",url:"../ecb-pricing/data.json",fut:"ECB dated €STR futures",futs:"€STR futures",time:"T13:15:00Z",policy:["dfr","ECB deposit rate"],
  base:"€STR this period",srcShort:"Eurex ECB Dated €STR futures, daily settlements",freq:"Weekdays, around 21:15 London",
  note:"Rates are the €STR each futures contract prices for the period after that meeting. €STR usually sits a few basis points under the ECB deposit rate.",
  src:"Data: Eurex ECB Dated €STR Futures daily settlements, €STR and deposit rate from the ECB, meeting dates from the ECB. Updated each weekday night."},
 boe:{label:"BoE",url:"../boe-pricing/data.json",fut:"the Bank of England's OIS curve",futs:"OIS curve",time:"T12:00:00Z",policy:["bank_rate","Bank Rate"],stamp:"OIS curve",
  base:"SONIA to next meeting",srcShort:"Bank of England daily OIS curve",freq:"Weekdays, around 13:30 London. The Bank publishes each day's curve the next working day",
  note:"Rates are the average SONIA the market prices between each meeting and the next, read off the Bank of England's daily OIS curve. The curve is smoothed, so the split between neighbouring meetings is approximate; the overall path is within a few basis points of MPC-dated SONIA futures. SONIA usually sits a few basis points under Bank Rate.",
  src:"Data: Bank of England daily OIS curve (published the next working day), SONIA and Bank Rate from the Bank of England, meeting dates from the Bank of England. Updated each weekday."}
};
function ldn(iso,o){return new Date(iso).toLocaleString("en-GB",Object.assign({timeZone:"Europe/London"},o))}
function stamp(){
 var P=D.path,B=BANKS[BANK],el=$("stamp"),age=(Date.now()-new Date(D.generated))/864e5,pa=(Date.now()-new Date(P.asof+"T12:00:00Z"))/864e5;
 var day=function(iso){return ldn(iso,{weekday:"short",day:"numeric",month:"short"}).replace(",","")};
 el.innerHTML='<div><span>Source</span>'+B.srcShort+'</div><div><span>Updates</span>'+B.freq+'</div>'+
  '<div><span>'+(B.stamp||"Futures prices")+' as of</span><b'+(pa>5?' class="old"':'')+'>'+day(P.asof+"T12:00:00Z")+'</b></div>'+
  '<div><span>Last refreshed</span><b'+(age>4?' class="old"':'')+'>'+day(D.generated)+', '+ldn(D.generated,{hour:"2-digit",minute:"2-digit"})+' London</b></div>';
}
/* Warn when the latest data could not be fetched (the page keeps showing the last good data). */
function dataWarn(D,H){var w=[],now=Date.now(),day=864e5,f=function(iso){return ldn(iso,{weekday:"short",day:"numeric",month:"short"})};
 if(D.problems&&D.problems.indexOf("path")>=0&&D.path)w.push("Last night's "+BANKS[BANK].futs+" prices could not be fetched, so pricing is from "+f(D.path.asof+"T12:00:00Z")+".");
 else if(D.path&&now-new Date(D.path.asof+"T12:00:00Z")>4*day)w.push(BANKS[BANK].futs.charAt(0).toUpperCase()+BANKS[BANK].futs.slice(1)+" prices are from "+f(D.path.asof+"T12:00:00Z")+" and haven't updated since.");
 if(now-new Date(D.generated)>4*day)w.push("The data hasn't refreshed since "+f(D.generated)+".");
 var el=document.getElementById("dwarn");if(!el)return;el.hidden=!w.length;if(w.length)el.innerHTML="<b>Data warning.</b> "+w.join(" ");}
var RPC="1w ago",RPV="me";
function rpath(){
 var P=D.path;if(!P||!P.rates||!P.rates.length){$("rp").hidden=true;return}$("rp").hidden=false;
 var e=P.effr,R=P.rates,C=RPC&&P.compare&&P.compare[RPC]?P.compare[RPC].rates:null,today=new Date(P.asof+"T12:00:00Z");
 function fd(s,o){return new Date(s+"T12:00:00Z").toLocaleDateString("en-GB",Object.assign({timeZone:"UTC"},o)).replace("Sept","Sep")}
 function sg(x,d){if(Math.abs(x)<Math.pow(10,-d)/2)x=0;return(x>0?"+":x<0?"−":"")+Math.abs(x).toFixed(d)}
 function pct(p){return p<0?"("+Math.abs(p).toFixed(0)+"%)":p.toFixed(0)+"%"}
 function cl(x){return x>.5?"rp-up":x<-.5?"rp-dn":"rp-mu"}
 var cums=R.map(function(r){return(r-e)*400}),all=cums.concat(C?C.map(function(r){return(r-e)*400}):[]).concat([0]);
 var nh=Math.max(1,Math.ceil(Math.max.apply(0,all)/100-1e-9)),nc=Math.max(0,Math.ceil(-Math.min.apply(0,all)/100-1e-9));
 var pk=0;R.forEach(function(r,i){if(Math.abs(r-e)>Math.abs(R[pk]-e))pk=i});var M=P.meetings,lm=M.length-1;var nx=0;while(nx<lm&&new Date(M[nx]+BANKS[BANK].time)<Date.now())nx++;
 $("rpstats").innerHTML=(BANKS[BANK].policy&&D[BANKS[BANK].policy[0]]?'<div><span>'+BANKS[BANK].policy[1]+'</span><b>'+D[BANKS[BANK].policy[0]].value.toFixed(2)+'%</b></div>':'')+'<div><span>'+BANKS[BANK].base+'</span><b>'+e.toFixed(2)+'%</b></div><div><span>Priced for '+fd(M[nx],{day:"numeric",month:"short"})+' meeting</span><b>'+Math.abs((R[nx]-(nx?R[nx-1]:e))*100).toFixed(1)+'bp <small style="font-size:13px;font-weight:600;color:var(--muted)">of '+(R[nx]<(nx?R[nx-1]:e)?"easing":"tightening")+'</small></b></div><div><span>'+(R[pk]>=e?"Peak":"Low")+'</span><b>'+R[pk].toFixed(2)+'%</b></div><div><span>'+fd(M[lm],{month:"short"})+" "+M[lm].slice(2,4)+'</span><b>'+R[lm].toFixed(2)+'%</b></div>';
 var h='<div class="rp-row hd"><div>Meeting</div><div>Priced</div><div>Cumulative %</div><div>Rate</div><div class="c-chg">'+(RPV=="cum"?"Cumulative bp":"This meeting")+'</div><div class="c-cmp">'+(C?"vs "+RPC:"")+'</div></div>',prev=e;
 R.forEach(function(r,i){
  var cum=cums[i],me=(r-prev)*100;prev=r;var days=Math.round((new Date(M[i]+BANKS[BANK].time)-today)/864e5),bl='<div class="rp-blocks">',k,f;
  for(k=nc;k>=1;k--){f=Math.max(0,Math.min(1,(-cum-(k-1)*100)/100));bl+='<div class="rp-blk c"><i style="width:'+(f*100).toFixed(1)+'%"></i></div>'}
  if(nc)bl+='<div class="rp-blk z"></div>';
  for(k=1;k<=nh;k++){f=Math.max(0,Math.min(1,(cum-(k-1)*100)/100));bl+='<div class="rp-blk"><i style="width:'+(f*100).toFixed(1)+'%"></i></div>'}
  if(C&&C[i]!=null){var cc=(C[i]-e)*400,pos=(cc+nc*100)/((nh+nc)*100);bl+='<span class="rp-mk" style="left:calc('+(pos*100).toFixed(2)+'% - 1px)" title="'+RPC+': '+pct(cc)+'"></span>'}
  bl+='</div>';var dv=C&&C[i]!=null?(r-C[i])*100:null;
  h+='<div class="rp-row"><div class="rp-dt"><b>'+fd(M[i],{day:"numeric",month:"short",year:"numeric"})+'</b><small>'+(days<60?days+" days":Math.round(days/30.4)+" months")+'</small></div>'+bl+'<div class="v big">'+pct(cum)+'</div><div class="v">'+r.toFixed(2)+'%</div><div class="v c-chg '+cl(RPV=="cum"?cum/4:me)+'">'+sg(RPV=="cum"?cum/4:me,1)+' bp</div><div class="v c-cmp '+(dv==null?"":cl(dv))+'">'+(dv==null?"":sg(dv,1)+" bp")+'</div></div>';
 });
 var sc='';for(k=nc;k>=1;k--)sc+="<span>"+(k*-25)+"bp</span>";if(nc)sc+='<span class="z"></span>';for(k=1;k<=nh;k++)sc+="<span>+"+k*25+"bp</span>";
 h+='<div class="rp-row" style="border:0;padding-top:4px"><div></div><div class="rp-scale">'+sc+'</div></div>';
 $("rplad").innerHTML=h;$("rpkc").hidden=!C;if(C)$("rpkw").textContent=fd(P.compare[RPC].asof,{day:"numeric",month:"short"});
}
document.querySelectorAll("#rpview button").forEach(function(b){b.onclick=function(){RPV=b.getAttribute("data-v");document.querySelectorAll("#rpview button").forEach(function(x){x.className=x===b?"on":""});rpath()}});
document.querySelectorAll("#rpseg button").forEach(function(b){b.onclick=function(){RPC=b.getAttribute("data-k");document.querySelectorAll("#rpseg button").forEach(function(x){x.className=x===b?"on":""});rpath()}});

function show(b){
 if(!BANKS[b])b=Object.keys(BANKS)[0];BANK=b;var B=BANKS[b];
 document.querySelectorAll("#bank button").forEach(function(x){x.className=x.getAttribute("data-b")===b?"on":""});
 $("fut").textContent=B.fut;$("note").innerHTML=B.note;$("src").textContent=B.src;
 document.title=B.label+" · Central Bank Pricing";
 function draw(j){if(BANK!==b)return;D=j;$("rperr").hidden=true;rpath();stamp();dataWarn(D,null)}
 if(CACHE[b]){draw(CACHE[b]);return}
 $("rp").hidden=true;$("stamp").textContent="";$("dwarn").hidden=true;
 fetch(B.url+"?"+Date.now()).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){if(!j.path)throw 0;CACHE[b]=j;draw(j)}).catch(function(){if(BANK===b){$("rp").hidden=true;$("rperr").hidden=false}});
}

show(location.hash.slice(1));
